<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの費用精算 | ログインテスト</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:36px auto;padding:0 18px;line-height:1.6}button{padding:12px 18px;margin:8px 8px 8px 0;font-size:16px}#uid,#error{overflow-wrap:anywhere}#error{color:#b00020}</style>
</head>
<body>
<h1>みんなの費用精算</h1><p>Firebase Googleログインの動作テスト</p>
<p id="status">ログイン状態を確認中…</p>
<button id="login" disabled>Googleでログイン</button><button id="logout" hidden>ログアウト</button>
<p id="uid"></p><p id="error" role="alert"></p>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
const firebaseConfig = {
  apiKey: 'AIzaSyCfueQA4tF1qtPWLYTUgBpRYQw_7bTNnAk',
  authDomain: 'expense-split-f748e.firebaseapp.com',
  projectId: 'expense-split-f748e',
  storageBucket: 'expense-split-f748e.firebasestorage.app',
  messagingSenderId: '1074975210736',
  appId: '1:1074975210736:web:5c6f5ead25b0d0604f9635'
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
const login=document.getElementById('login');
const logout=document.getElementById('logout');
const status=document.getElementById('status');
const uid=document.getElementById('uid');
const error=document.getElementById('error');
onAuthStateChanged(auth,user=>{
 status.textContent=user?'ログイン中：'+(user.displayName||user.email||'Googleユーザー'):'未ログイン';
 uid.textContent=user?'UID：'+user.uid:'';
 login.hidden=!!user;login.disabled=false;logout.hidden=!user;
},err=>{status.textContent='ログイン状態を確認できませんでした';error.textContent=err.message;});
login.addEventListener('click',async()=>{
 error.textContent='';login.disabled=true;
 try{await signInWithPopup(auth,provider)}catch(err){error.textContent='ログインエラー：'+err.code+' / '+err.message}finally{login.disabled=false}
});
logout.addEventListener('click',async()=>{
 error.textContent='';try{await signOut(auth)}catch(err){error.textContent='ログアウトエラー：'+err.message}
});
</script>
</body></html>
